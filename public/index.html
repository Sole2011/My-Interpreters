<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponent | Find an interpreter</title>
<meta name="description" content="Find an interpreter by language and location. Search by city, state, address, or ZIP code.">
<link rel="stylesheet" href="style.css?v=password-reset-13">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <a class="brand" href="#top" aria-label="Exponent, home"><span class="brand-mark" aria-hidden="true">E</span> Exponent</a>
  <nav aria-label="Account navigation"><span id="auth"></span></nav>
</header>

<main id="main" tabindex="-1">
  <section class="hero" id="top" aria-labelledby="hero-title">
    <div class="hero-heading">
      <h1 id="hero-title">Find interpreter</h1>
      <details class="more-filters headline-more-filters">
        <summary>More filters</summary>
        <div class="filters-more">
          <label class="field">Certification
            <select name="certification" form="filters">
              <option value="">Any certification</option>
              <option value="CCHI">CCHI</option>
              <option value="NBCMI">NBCMI</option>
              <option value="Court certified">Court certified</option>
            </select>
          </label>
          <fieldset class="filter-checks"><legend>Scope of interpretation</legend>
            <label class="check"><input type="checkbox" name="certification_scope" value="national" form="filters"> National</label>
            <label class="check"><input type="checkbox" name="certification_scope" value="international" form="filters"> International</label>
            <label class="check"><input type="checkbox" name="certification_scope" value="state" form="filters"> State</label>
            <label class="check"><input type="checkbox" name="certification_scope" value="local" form="filters"> Local</label>
          </fieldset>
          <label class="field">Maximum hourly rate ($)
            <input name="maxRate" type="number" min="0" inputmode="decimal" form="filters">
          </label>
          <label class="check"><input type="checkbox" name="verified" form="filters"> Verified interpreter only</label>
          <label class="check"><input type="checkbox" name="available" form="filters"> Available now</label>
        </div>
      </details>
    </div>
    <button type="button" id="start-search" class="search-launch" aria-label="Start searching for an interpreter">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
    </button>
    <div id="search" class="search-engine" aria-label="Interpreter search" hidden>
    <form id="filters" aria-label="Interpreter search filters">
      <div class="search-primary">
        <div class="icon-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>
          <select id="filter-language" name="language" aria-label="Language" required>
            <option value="" selected disabled>Choose language</option>
          </select>
        </div>
        <div class="icon-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <input id="filter-location" name="q" type="search" aria-label="Location" autocomplete="street-address" placeholder="City, state, or ZIP code" required>
        </div>
      </div>
      <div class="filters-main">
        <label class="field">Specialty
          <select name="specialty">
            <option value="">Any specialty</option>
            <option value="conference">Conference</option>
            <option value="education">Education</option>
            <option value="legal">Legal</option>
            <option value="medical">Medical</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label class="field">Service mode
          <select name="mode">
            <option value="">Remote or in-person</option>
            <option value="remote">Remote</option>
            <option value="in-person">In-person</option>
          </select>
        </label>
      </div>
      <button type="submit" class="search-submit">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        Find interpreters
      </button>
    </form>
    <p id="count" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="results" aria-label="Interpreter listings"></div>
    </div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dialog-title"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=password-reset-13"></script>
</body>
</html>
